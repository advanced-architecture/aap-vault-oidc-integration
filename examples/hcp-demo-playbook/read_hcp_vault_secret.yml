---
# ---------------------------------------------------------------------------
# IMPORTANT: This playbook MUST be run as an AAP Job Template.
#
# This is the HCP Vault Dedicated variant of the demo playbook.
# It is identical to examples/demo-playbook/read_vault_secret.yml with one
# addition: the vault_namespace variable (default: 'admin') is passed as the
# X-Vault-Namespace header on all Vault API calls.
#
# AAP 2.7 injects a short-lived per-job OIDC JWT token into the execution
# environment via the environment variable AAP_JWT_TOKEN. This token is used
# to authenticate directly to HCP Vault Dedicated without any static credentials.
#
# Running this playbook locally (e.g. via `ansible-playbook`) will fail at the
# JWT-capture step because AAP_JWT_TOKEN will not be set.
#
# NOTE: AAP_JWT_TOKEN is the expected environment variable name as of AAP 2.7.
# Confirm the exact variable name during live testing against your AAP instance,
# as it may differ depending on configuration or future releases.
# ---------------------------------------------------------------------------


- name: Demo — Read HCP Vault Dedicated secret using AAP OIDC JWT (no static credentials)
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars.yml

  tasks:
    - name: Print all environment variables (diagnostic — remove after confirming JWT var name)
      ansible.builtin.command: env
      register: env_output
      no_log: false

    - name: Show environment variables
      ansible.builtin.debug:
        var: env_output.stdout_lines

    - name: Capture AAP-injected JWT token from environment
      ansible.builtin.set_fact:
        jwt_token: "{{ lookup('env', 'AAP_JWT_TOKEN') }}"

    - name: Fail if AAP_JWT_TOKEN is not set
      ansible.builtin.fail:
        msg: >-
          AAP_JWT_TOKEN environment variable is not set.
          Ensure the OIDC issuer is enabled in AAP 2.7 and this playbook
          is run as an AAP job template.
      when: jwt_token | length == 0

    - name: Authenticate to HCP Vault Dedicated using the AAP JWT token
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault_jwt_mount_path }}/login"
        method: POST
        headers:
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          role: "{{ vault_jwt_role_name }}"
          jwt: "{{ jwt_token }}"
        status_code: [200]
      register: vault_login_result
      no_log: true

    - name: Read secret from HCP Vault Dedicated
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_secret_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_login_result.json.auth.client_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
        status_code: [200]
      register: vault_secret
      no_log: true

    - name: Confirm secret retrieval (keys only — values are not printed)
      ansible.builtin.debug:
        msg: >-
          Secret retrieved successfully from HCP Vault Dedicated path {{ vault_secret_path }}.
          Keys found: {{ vault_secret.json.data.data.keys() | list }}
