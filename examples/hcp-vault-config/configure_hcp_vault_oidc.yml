---
# =============================================================================
# HCP Vault Dedicated — JWT auth method configuration playbook
#
# This playbook targets HCP Vault Dedicated clusters.
#
# Key differences from examples/vault-config/configure_vault_oidc.yml:
#   - The 'vault_namespace' variable (default: admin) is required. All Vault
#     API calls on HCP Vault Dedicated must target a namespace; the root
#     namespace on every HCP Vault Dedicated cluster is 'admin'.
#   - The 'vault_token' must be an HCP service principal token with the
#     Contributor role on the Vault cluster. It is NOT a root token — HCP
#     Vault Dedicated does not expose root tokens. Obtain the token from the
#     HCP portal: Access Control → Service Principals → your principal →
#     Generate token.
#
# vault_token is injected by the Vault Bootstrap Token credential attached to
# this job template. Create a custom credential type with the following injector:
#   env:
#     VAULT_TOKEN: '{{ vault_token }}'
# Then create a credential instance with your HCP service principal token and
# attach it to this job template.
# =============================================================================

- name: Configure HCP Vault Dedicated JWT auth method for AAP OIDC integration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml

  tasks:
    - name: Fail if vault_token is not set
      ansible.builtin.fail:
        msg: "vault_token is not set. Attach the Vault Bootstrap Token credential to this job template."
      when: (vault_token is not defined) or (vault_token | length == 0)

    - name: Enable JWT auth method at configured mount path
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth/{{ vault_jwt_mount_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "jwt"
        status_code: [200, 204, 400]
      register: enable_jwt_result
      failed_when:
        - enable_jwt_result.status == 400
        - "'path is already in use' not in (enable_jwt_result.json.errors | default([]) | join(' '))"

    - name: Configure JWT auth method with AAP OIDC discovery URL
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault_jwt_mount_path }}/config"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          oidc_discovery_url: "{{ aap_oidc_discovery_url }}"
          default_role: "{{ vault_jwt_role_name }}"
        status_code: [200, 204]

    - name: Create Vault policy granting read access to the demo secret path
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/policies/acl/{{ vault_policy_name }}"
        method: PUT
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          policy: |
            path "{{ vault_secret_path }}" {
              capabilities = ["read", "list"]
            }

            path "{{ vault_secret_path }}/*" {
              capabilities = ["read", "list"]
            }
        status_code: [200, 204]

    - name: Create JWT role for AAP automation jobs
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault_jwt_mount_path }}/role/{{ vault_jwt_role_name }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          bound_audiences:
            - "{{ jwt_bound_audience }}"
          user_claim: "sub"
          policies:
            - "{{ vault_policy_name }}"
          token_ttl: "{{ jwt_token_ttl }}"
          role_type: "jwt"
        status_code: [200, 204]

    - name: Enable KV v2 secrets engine
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/mounts/{{ vault_kv_mount }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          type: "kv"
          options:
            version: "2"
        status_code: [200, 204, 400]
      register: enable_kv_result
      failed_when:
        - enable_kv_result.status == 400
        - "'path is already in use' not in (enable_kv_result.json.errors | default([]) | join(' '))"

    - name: Write sample secret to KV v2 for demo playbook
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_kv_mount }}/data/{{ vault_kv_secret_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          X-Vault-Namespace: "{{ vault_namespace }}"
          Content-Type: "application/json"
        body_format: json
        body:
          data:
            username: "demo-user"
            password: "demo-secret-value"
        status_code: [200, 204]
