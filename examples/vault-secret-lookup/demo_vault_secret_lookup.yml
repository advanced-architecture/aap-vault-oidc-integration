---
# =============================================================================
# demo_vault_secret_lookup.yml
#
# Demonstrates the AAP-native OIDC secret lookup workflow.
#
# In this pattern AAP issues a JWT, authenticates to Vault transparently at
# job launch time using the "HashiCorp Vault Secret Lookup (OIDC)" credential,
# and injects the fetched secret value into the job as the extra var
# `hashicorp_vault_value`. The playbook never handles tokens or credentials.
#
# Prerequisites:
#   - The "Vault Value - <path> / <key>" credential is attached to this job
#     template, with its field linked to the Vault OIDC lookup credential.
#   - See examples/vault-secret-lookup/README.md for setup instructions.
# =============================================================================

- name: Demo — AAP-native Vault OIDC secret lookup (no playbook-level Vault calls)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Fail if hashicorp_vault_value was not injected
      ansible.builtin.fail:
        msg: >-
          hashicorp_vault_value extra var is not set.
          Ensure the HashiCorp Vault Value credential is attached to this job template
          and its field is linked to the Vault OIDC Lookup credential.
      when: (hashicorp_vault_value is not defined) or (hashicorp_vault_value | length == 0)

    - name: Confirm secret was retrieved and injected by AAP
      ansible.builtin.debug:
        msg: >-
          Secret successfully retrieved from Vault via AAP OIDC lookup
          and injected as extra var. Value length: {{ hashicorp_vault_value | length }} chars.
          (Value is not printed — use no_log: true on any task that consumes it.)
