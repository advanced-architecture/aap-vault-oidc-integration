---
# =============================================================================
# configure_vault_secret_lookup.yml
#
# Creates a "HashiCorp Vault Secret Lookup" credential instance using the
# built-in AAP credential type. This credential is attached to job templates
# to enable AAP to fetch secrets from Vault via OIDC before the job runs.
#
# Bootstrap credentials are read from environment variables (CONTROLLER_*).
# Attach the built-in "Red Hat Ansible Automation Platform" credential type
# to this job template, or export the variables before launching:
#   CONTROLLER_HOST, CONTROLLER_USERNAME, CONTROLLER_PASSWORD, CONTROLLER_VERIFY_SSL
# See examples/aap-config/README.md for setup.
# =============================================================================

- name: Configure AAP Vault OIDC secret lookup credential
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    aap_api_base: "{{ lookup('env', 'CONTROLLER_HOST') }}/api/controller"

  tasks:
    - name: Fail if required controller credentials are not set
      ansible.builtin.fail:
        msg: >-
          Required environment variable '{{ item }}' is not set.
          Attach the built-in "Red Hat Ansible Automation Platform" credential type to this job template,
          or export the CONTROLLER_* variables before launching.
      when: lookup('env', item) | length == 0
      loop:
        - CONTROLLER_HOST
        - CONTROLLER_USERNAME
        - CONTROLLER_PASSWORD

    # -------------------------------------------------------------------------
    # Task 1 — Look up the built-in HashiCorp Vault Secret Lookup type
    # -------------------------------------------------------------------------
    - name: Look up built-in HashiCorp Vault Secret Lookup credential type ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credential_types/?name=HashiCorp+Vault+Secret+Lookup"
        method: GET
        url_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        url_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: "{{ (lookup('env', 'CONTROLLER_VERIFY_SSL') | default('true', true)) | bool }}"
      register: vault_lookup_type_lookup

    - name: Fail if built-in credential type not found
      ansible.builtin.fail:
        msg: >-
          Built-in 'HashiCorp Vault Secret Lookup' credential type not found.
          Ensure AAP 2.7 is installed with the OIDC workload identity feature enabled.
      when: vault_lookup_type_lookup.json.count == 0

    - name: Capture built-in Vault lookup credential type ID
      ansible.builtin.set_fact:
        vault_lookup_type_id: "{{ vault_lookup_type_lookup.json.results[0].id | int }}"

    # -------------------------------------------------------------------------
    # Task 2 — Look up organization ID
    # -------------------------------------------------------------------------
    - name: Look up organization ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/organizations/?name={{ aap_organization | urlencode }}"
        method: GET
        url_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        url_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        validate_certs: "{{ (lookup('env', 'CONTROLLER_VERIFY_SSL') | default('true', true)) | bool }}"
      register: org_lookup

    - name: Capture organization ID
      ansible.builtin.set_fact:
        aap_organization_id: "{{ org_lookup.json.results[0].id | int }}"

    # -------------------------------------------------------------------------
    # Task 3 — Create the HashiCorp Vault Secret Lookup credential instance
    # -------------------------------------------------------------------------
    - name: Create HashiCorp Vault Secret Lookup credential instance
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credentials/"
        method: POST
        url_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
        url_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Vault OIDC Lookup - {{ vault_jwt_role_name }}"
          credential_type: "{{ vault_lookup_type_id }}"
          organization: "{{ aap_organization_id }}"
          inputs:
            url: "{{ vault_addr }}"
            api_version: "v2"
            default_auth_path: "{{ vault_jwt_mount_path }}"
            jwt_role: "{{ vault_jwt_role_name }}"
            namespace: "{{ vault_namespace | default('') }}"
        status_code: [200, 201, 400]
        validate_certs: "{{ (lookup('env', 'CONTROLLER_VERIFY_SSL') | default('true', true)) | bool }}"
      register: vault_lookup_cred_result
      failed_when:
        - vault_lookup_cred_result.status == 400
        - "'name already exists' not in (vault_lookup_cred_result.json | to_json)"

    - name: Report Vault OIDC lookup credential
      ansible.builtin.debug:
        msg: >-
          'Vault OIDC Lookup - {{ vault_jwt_role_name }}' credential ready
          (HTTP {{ vault_lookup_cred_result.status }}).
          Attach this credential to job templates that need Vault secrets.
          Use the key icon on a credential field to link a specific secret value.
