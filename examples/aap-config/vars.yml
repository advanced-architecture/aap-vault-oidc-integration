---
# AAP admin credentials are injected by the AAP Admin Credential attached to this job template.
# See README.md for how to create the custom credential type and credential instance.

# Address of the Vault server (no trailing slash) — stored in the AAP credential
vault_addr: "https://vault.example.com:8200"

# The JWT auth method mount path in Vault
vault_jwt_mount_path: "jwt"

# The JWT role name in Vault that AAP jobs will authenticate against
vault_jwt_role_name: "aap-automation"

# Vault namespace — set to 'admin' for HCP Vault Dedicated; leave empty for self-managed Vault
vault_namespace: ""

# The KV path that the demo playbook will read (used in job template extra_vars)
vault_secret_path: "secret/data/aap-demo/config"

# AAP project name — must match the project added in Step 1
aap_project_name: "AAP Vault OIDC Integration Pattern"

# Inventory name to attach to job templates — must resolve localhost
aap_inventory_name: "Demo Inventory"
