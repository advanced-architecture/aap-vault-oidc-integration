---
# AAP admin credentials are read from environment variables at run-time.
# Export these before running this playbook:
#   export CONTROLLER_HOST="https://<your-aap-host>"
#   export CONTROLLER_USERNAME="<admin-username>"
#   export CONTROLLER_PASSWORD="<admin-password>"
#   export CONTROLLER_VERIFY_SSL="true"   # set to false to skip TLS validation (optional)

# Address of the Vault server (no trailing slash) — stored in the AAP credential
vault_addr: "https://vault.example.com:8200"

# The JWT auth method mount path in Vault
vault_jwt_mount_path: "jwt"

# The JWT role name in Vault that AAP jobs will authenticate against
vault_jwt_role_name: "aap-automation"

# The KV path that the demo playbook will read (used in job template extra_vars)
vault_secret_path: "secret/data/aap-demo/config"
