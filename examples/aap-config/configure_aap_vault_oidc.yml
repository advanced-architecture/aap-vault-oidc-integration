---
# Bootstrap credentials are injected by the AAP Admin Credential attached to this job template.
# Create a custom credential type with the following injector extra_vars:
#   controller_host, controller_username, controller_password, controller_verify_ssl
# Then create a credential instance of that type and attach it to this job template.
#
# NOTE: The AAP OIDC issuer is enabled by default on AAP 2.7 platform-gateway deployments.
# Verify it is active before running this playbook:
#   curl -L <controller_host>/o/.well-known/openid-configuration/
# A valid OIDC discovery document confirms the issuer is live. No manual enablement is needed.
#
# SECURITY: Credentials are passed to each uri task via url_username / url_password with
# force_basic_auth: true. The uri module declares url_password with no_log=True in its
# argument spec (ansible/modules/uri.py), which causes Ansible to scrub the value from
# all task output and logs. Response bodies are additionally passed through sanitize_keys()
# against the no_log value set before being returned to the controller.
# The aap_auth_header pattern (b64encode of username:password stored in a play var) is
# intentionally avoided — a play var is NOT scrubbed and would appear in verbose output.

- name: Configure AAP for HashiCorp Vault JWT authentication
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    # Bootstrap credentials injected by the AAP Admin Credential (custom credential type)
    # controller_host, controller_username, controller_password, controller_verify_ssl
    # are all supplied as extra vars by the credential injector — no defaults needed here.
    aap_api_base: "{{ controller_host }}"

  tasks:
    - name: Fail if required controller credentials are not set
      ansible.builtin.fail:
        msg: >-
          Required variable '{{ item }}' is not set.
          Attach the AAP Admin Credential to this job template.
      when: (vars[item] is not defined) or (vars[item] | length == 0)
      loop:
        - controller_host
        - controller_username
        - controller_password

    # -------------------------------------------------------------------------
    # Task 1 — Create the custom credential type for HashiCorp Vault JWT auth
    # -------------------------------------------------------------------------
    - name: Create HashiCorp Vault JWT credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "HashiCorp Vault JWT"
          kind: "cloud"
          inputs:
            fields:
              - id: "vault_addr"
                type: "string"
                label: "Vault Address"
              - id: "vault_jwt_mount"
                type: "string"
                label: "JWT Auth Mount Path"
              - id: "vault_role"
                type: "string"
                label: "JWT Role Name"
            required:
              - "vault_addr"
              - "vault_jwt_mount"
              - "vault_role"
          injectors:
            extra_vars:
              vault_addr: "{% raw %}{{ vault_addr }}{% endraw %}"
              vault_jwt_mount: "{% raw %}{{ vault_jwt_mount }}{% endraw %}"
              vault_role: "{% raw %}{{ vault_role }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ controller_verify_ssl }}"
      register: credential_type_result
      failed_when:
        - credential_type_result.status == 400
        - "'name already exists' not in (credential_type_result.json | to_json)"

    - name: Look up existing HashiCorp Vault JWT credential type ID (when already exists)
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credential_types/?name=HashiCorp+Vault+JWT"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: credential_type_lookup
      when: credential_type_result.status == 400

    - name: Capture credential type ID
      ansible.builtin.set_fact:
        vault_jwt_credential_type_id: >-
          {{ credential_type_result.json.id
             if credential_type_result.status in [200, 201]
             else credential_type_lookup.json.results[0].id }}

    - name: Report credential type
      ansible.builtin.debug:
        msg: "HashiCorp Vault JWT credential type ID: {{ vault_jwt_credential_type_id }}"

    # -------------------------------------------------------------------------
    # Task 2 — Create a credential instance of the HashiCorp Vault JWT type
    # -------------------------------------------------------------------------
    - name: Create Vault JWT credential instance
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credentials/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Vault JWT - {{ vault_jwt_role_name }}"
          credential_type: "{{ vault_jwt_credential_type_id }}"
          inputs:
            vault_addr: "{{ vault_addr }}"
            vault_jwt_mount: "{{ vault_jwt_mount_path }}"
            vault_role: "{{ vault_jwt_role_name }}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ controller_verify_ssl }}"
      register: credential_result
      failed_when:
        - credential_result.status == 400
        - "'name already exists' not in (credential_result.json | to_json)"

    - name: Report credential instance
      ansible.builtin.debug:
        msg: >-
          Vault JWT credential '{{ vault_jwt_role_name }}' ready
          (HTTP {{ credential_result.status }})
