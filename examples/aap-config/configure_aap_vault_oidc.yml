---
# Bootstrap credentials are injected by the AAP Admin Credential attached to this job template.
# Create a custom credential type with the following injector extra_vars:
#   controller_host, controller_username, controller_password, controller_verify_ssl
# Then create a credential instance of that type and attach it to this job template.
#
# NOTE: The AAP OIDC issuer is enabled by default on AAP 2.7 platform-gateway deployments.
# Verify it is active before running this playbook:
#   curl -L <controller_host>/o/.well-known/openid-configuration/
# A valid OIDC discovery document confirms the issuer is live. No manual enablement is needed.
#
# SECURITY: Credentials are passed to each uri task via url_username / url_password with
# force_basic_auth: true. The uri module declares url_password with no_log=True in its
# argument spec (ansible/modules/uri.py), which causes Ansible to scrub the value from
# all task output and logs. Response bodies are additionally passed through sanitize_keys()
# against the no_log value set before being returned to the controller.
# The aap_auth_header pattern (b64encode of username:password stored in a play var) is
# intentionally avoided — a play var is NOT scrubbed and would appear in verbose output.

- name: Configure AAP for HashiCorp Vault JWT authentication
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    # Bootstrap credentials injected by the AAP Admin Credential (custom credential type)
    # controller_host, controller_username, controller_password, controller_verify_ssl
    # are all supplied as extra vars by the credential injector — no defaults needed here.
    aap_api_base: "{{ controller_host }}/api/controller"
    # Organization that will own the credential instance
    aap_organization: "Default"
    # AAP project name — used to look up the project ID for job template creation
    aap_project_name: "AAP Vault OIDC Integration Pattern"
    # Inventory name to attach to job templates — must resolve localhost
    aap_inventory_name: "Demo Inventory"

  tasks:
    - name: Fail if required controller credentials are not set
      ansible.builtin.fail:
        msg: >-
          Required variable '{{ item }}' is not set.
          Attach the AAP Admin Credential to this job template.
      when: (vars[item] is not defined) or (vars[item] | length == 0)
      loop:
        - controller_host
        - controller_username
        - controller_password

    # -------------------------------------------------------------------------
    # Task 1 — Create the custom credential type for HashiCorp Vault JWT auth
    # -------------------------------------------------------------------------
    - name: Create HashiCorp Vault JWT credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credential_types/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "HashiCorp Vault JWT"
          kind: "cloud"
          inputs:
            fields:
              - id: "vault_addr"
                type: "string"
                label: "Vault Address"
              - id: "vault_jwt_mount"
                type: "string"
                label: "JWT Auth Mount Path"
              - id: "vault_role"
                type: "string"
                label: "JWT Role Name"
              - id: "vault_namespace"
                type: "string"
                label: "Vault Namespace (leave blank for self-managed Vault)"
            required:
              - "vault_addr"
              - "vault_jwt_mount"
              - "vault_role"
          injectors:
            extra_vars:
              vault_addr: "{% raw %}{{ vault_addr }}{% endraw %}"
              vault_jwt_mount: "{% raw %}{{ vault_jwt_mount }}{% endraw %}"
              vault_role: "{% raw %}{{ vault_role }}{% endraw %}"
              vault_namespace: "{% raw %}{{ vault_namespace }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ controller_verify_ssl }}"
      register: credential_type_result
      failed_when:
        - credential_type_result.status == 400
        - "'Name and Kind already exists' not in (credential_type_result.json | to_json)"

    - name: Print the credential result
      ansible.builtin.debug:
        var: credential_type_result

    - name: Look up HashiCorp Vault JWT credential type ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credential_types/?name=HashiCorp+Vault+JWT"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: credential_type_lookup

    - name: Capture credential type ID
      ansible.builtin.set_fact:
        vault_jwt_credential_type_id: "{{ credential_type_lookup.json.results[0].id }}"

    - name: Report credential type
      ansible.builtin.debug:
        msg: "HashiCorp Vault JWT credential type ID: {{ vault_jwt_credential_type_id }}"

    # -------------------------------------------------------------------------
    # Task 2 — Create a credential instance of the HashiCorp Vault JWT type
    # -------------------------------------------------------------------------
    - name: Look up organization ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/organizations/?name={{ aap_organization | urlencode }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: org_lookup

    - name: Capture organization ID
      ansible.builtin.set_fact:
        aap_organization_id: "{{ org_lookup.json.results[0].id }}"

    - name: Create Vault JWT credential instance
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credentials/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Vault JWT - {{ vault_jwt_role_name }}"
          credential_type: "{{ vault_jwt_credential_type_id }}"
          organization: "{{ aap_organization_id }}"
          inputs:
            vault_addr: "{{ vault_addr }}"
            vault_jwt_mount: "{{ vault_jwt_mount_path }}"
            vault_role: "{{ vault_jwt_role_name }}"
            vault_namespace: "{{ vault_namespace | default('') }}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ controller_verify_ssl }}"
      register: credential_result
      failed_when:
        - credential_result.status == 400
        - "'already exists' not in (credential_result.json | to_json)"

    - name: Report credential instance
      ansible.builtin.debug:
        msg: >-
          Vault JWT credential '{{ vault_jwt_role_name }}' ready
          (HTTP {{ credential_result.status }})

    # -------------------------------------------------------------------------
    # Task 3 — Create the Vault Bootstrap Token credential type
    #          (credential instance must be created manually — requires the token)
    # -------------------------------------------------------------------------
    - name: Create Vault Bootstrap Token credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credential_types/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Vault Bootstrap Token"
          kind: "cloud"
          inputs:
            fields:
              - id: "vault_token"
                type: "string"
                label: "Vault Token"
                secret: true
            required:
              - "vault_token"
          injectors:
            env:
              VAULT_TOKEN: "{% raw %}{{ vault_token }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ controller_verify_ssl }}"
      register: vault_bootstrap_type_result
      failed_when:
        - vault_bootstrap_type_result.status == 400
        - "'Name and Kind already exists' not in (vault_bootstrap_type_result.json | to_json)"

    - name: Look up Vault Bootstrap Token credential type ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credential_types/?name=Vault+Bootstrap+Token"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: vault_bootstrap_type_lookup

    - name: Report Vault Bootstrap Token credential type
      ansible.builtin.debug:
        msg: >-
          Vault Bootstrap Token credential type ID: {{ vault_bootstrap_type_lookup.json.results[0].id }}
          — create a credential instance manually in AAP with your Vault/HCP service principal token.

    # -------------------------------------------------------------------------
    # Task 4 — Create job templates
    # -------------------------------------------------------------------------
    - name: Look up project ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/projects/?name={{ aap_project_name | urlencode }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: project_lookup

    - name: Fail if project not found
      ansible.builtin.fail:
        msg: "Project '{{ aap_project_name }}' not found. Add the repo as an AAP project and sync it first."
      when: project_lookup.json.count == 0

    - name: Capture project ID
      ansible.builtin.set_fact:
        aap_project_id: "{{ project_lookup.json.results[0].id }}"

    - name: Look up inventory ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/inventories/?name={{ aap_inventory_name | urlencode }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: inventory_lookup

    - name: Fail if inventory not found
      ansible.builtin.fail:
        msg: "Inventory '{{ aap_inventory_name }}' not found. Update aap_inventory_name in vars or extra vars."
      when: inventory_lookup.json.count == 0

    - name: Capture inventory ID
      ansible.builtin.set_fact:
        aap_inventory_id: "{{ inventory_lookup.json.results[0].id }}"

    - name: Look up Vault Bootstrap Token credential ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credentials/?name=Vault+Bootstrap+Token+-+HCP&credential_type={{ vault_bootstrap_type_lookup.json.results[0].id }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: vault_bootstrap_cred_lookup

    - name: Capture Vault Bootstrap Token credential ID (if it exists)
      ansible.builtin.set_fact:
        vault_bootstrap_cred_id: "{{ vault_bootstrap_cred_lookup.json.results[0].id | int }}"
      when: vault_bootstrap_cred_lookup.json.count > 0

    - name: Look up Vault JWT credential ID
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/credentials/?name=Vault+JWT+-+{{ vault_jwt_role_name | urlencode }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: vault_jwt_cred_lookup

    - name: Capture Vault JWT credential ID
      ansible.builtin.set_fact:
        vault_jwt_cred_id: "{{ vault_jwt_cred_lookup.json.results[0].id | int }}"
      when: vault_jwt_cred_lookup.json.count > 0

    - name: Create job templates
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/job_templates/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          job_type: "run"
          inventory: "{{ aap_inventory_id }}"
          project: "{{ aap_project_id }}"
          playbook: "{{ item.playbook }}"
          extra_vars: "{{ item.extra_vars | default({}) | to_json }}"
        status_code: [200, 201, 400]
        validate_certs: "{{ controller_verify_ssl }}"
      register: jt_result
      failed_when:
        - jt_result.status == 400
        - "'already exists' not in (jt_result.json | to_json)"
      loop:
        - name: "2 - Configure HCP Vault OIDC"
          playbook: "examples/hcp-vault-config/configure_hcp_vault_oidc.yml"
          extra_vars:
            vault_addr: "{{ vault_addr }}"
            vault_namespace: "{{ vault_namespace | default('admin') }}"
        - name: "2a - Configure Vault OIDC (self-managed)"
          playbook: "examples/vault-config/configure_vault_oidc.yml"
          extra_vars:
            vault_addr: "{{ vault_addr }}"
        - name: "3a - Demo: Self-Managed Vault Secret via OIDC JWT"
          playbook: "examples/demo-playbook/read_vault_secret.yml"
        - name: "3b - Demo: HCP Vault Secret via OIDC JWT"
          playbook: "examples/hcp-demo-playbook/read_hcp_vault_secret.yml"
        - name: "4 - Configure Vault OIDC Secret Lookup"
          playbook: "examples/vault-secret-lookup/configure_vault_secret_lookup.yml"
          extra_vars:
            vault_addr: "{{ vault_addr }}"
            vault_jwt_mount_path: "{{ vault_jwt_mount_path }}"
            vault_jwt_role_name: "{{ vault_jwt_role_name }}"
            vault_namespace: "{{ vault_namespace | default('admin') }}"
        - name: "5 - Demo: Vault OIDC Secret Lookup"
          playbook: "examples/vault-secret-lookup/demo_vault_secret_lookup.yml"
      loop_control:
        label: "{{ item.name }}"

    # Look up all template IDs by name after create — handles the already-exists case
    # where jt_result has no .json.id for templates that returned 400.
    - name: Look up job template IDs by name
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/job_templates/?name={{ item | urlencode }}"
        method: GET
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_verify_ssl }}"
      register: jt_lookup
      loop:
        - "2 - Configure HCP Vault OIDC"
        - "2a - Configure Vault OIDC (self-managed)"
        - "3a - Demo: Self-Managed Vault Secret via OIDC JWT"
        - "3b - Demo: HCP Vault Secret via OIDC JWT"
        - "4 - Configure Vault OIDC Secret Lookup"
        - "5 - Demo: Vault OIDC Secret Lookup"
      loop_control:
        label: "{{ item }}"

    - name: Build job template name-to-ID map
      ansible.builtin.set_fact:
        jt_id_map: >-
          {{ jt_id_map | default({}) | combine({
            item.item: item.json.results[0].id | int
          }) }}
      loop: "{{ jt_lookup.results }}"
      when: item.json.count > 0
      loop_control:
        label: "{{ item.item }}"

    - name: Attach Vault Bootstrap Token credential to Vault config job templates
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/job_templates/{{ item }}/credentials/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: raw
        body: '{"id": {{ vault_bootstrap_cred_id | int }} }'
        status_code: [200, 201, 204, 400]
        validate_certs: "{{ controller_verify_ssl }}"
      failed_when:
        - item | string | length > 0
        - jt_bootstrap_attach.status == 400
        - "'already exists' not in (jt_bootstrap_attach.json | to_json)"
      register: jt_bootstrap_attach
      when:
        - vault_bootstrap_cred_id is defined
        - item | string | length > 0
      loop:
        - "{{ jt_id_map.get('2 - Configure HCP Vault OIDC', '') }}"
        - "{{ jt_id_map.get('2a - Configure Vault OIDC (self-managed)', '') }}"
        - "{{ jt_id_map.get('4 - Configure Vault OIDC Secret Lookup', '') }}"
      loop_control:
        label: "{{ item }}"

    - name: Attach Vault JWT credential to demo job templates
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/v2/job_templates/{{ item }}/credentials/"
        method: POST
        url_username: "{{ controller_username }}"
        url_password: "{{ controller_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: raw
        body: '{"id": {{ vault_jwt_cred_id | int }} }'
        status_code: [200, 201, 204, 400]
        validate_certs: "{{ controller_verify_ssl }}"
      failed_when:
        - item | string | length > 0
        - jt_jwt_attach.status == 400
        - "'already exists' not in (jt_jwt_attach.json | to_json)"
      register: jt_jwt_attach
      when:
        - vault_jwt_cred_id is defined
        - item | string | length > 0
      loop:
        - "{{ jt_id_map.get('3a - Demo: Self-Managed Vault Secret via OIDC JWT', '') }}"
        - "{{ jt_id_map.get('3b - Demo: HCP Vault Secret via OIDC JWT', '') }}"
      loop_control:
        label: "{{ item }}"

    - name: Report job templates
      ansible.builtin.debug:
        msg: >-
          Job templates created and credentials attached where available.
          If Vault Bootstrap Token or Vault JWT credentials were not yet created,
          attach them manually to the relevant templates.
