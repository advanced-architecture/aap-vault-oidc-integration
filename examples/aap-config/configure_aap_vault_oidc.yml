---
# NOTE: The OIDC issuer enablement step (Task 1 below) uses the AAP Gateway settings API.
# The exact endpoint path and setting key should be verified against the live AAP 2.7 instance
# during testing. The endpoint used here is based on AAP 2.7 documentation and may differ
# depending on the deployment topology (standalone controller vs. platform gateway).
#
# NOTE: This playbook uses the built-in AAP platform credential (kind: tower), which injects
# tower_host, tower_username, tower_password, and tower_verify_ssl at run-time.
# Attach a "Red Hat Ansible Automation Platform" credential to the job template before
# launching — do NOT set these values in Extra Variables.
#
# SECURITY: Credentials are passed to each uri task via url_username / url_password with
# force_basic_auth: true. The uri module declares url_password with no_log=True in its
# argument spec (ansible/modules/uri.py), which causes Ansible to scrub the value from
# all task output and logs. Response bodies are additionally passed through sanitize_keys()
# against the no_log value set before being returned to the controller.
# The aap_auth_header pattern (b64encode of username:password stored in a play var) is
# intentionally avoided — a play var is NOT scrubbed and would appear in verbose output.
# no_log: true is also set on each task as a defence-in-depth measure.

- name: Configure AAP for HashiCorp Vault JWT authentication
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    aap_api_base: "https://{{ tower_host }}"

  tasks:
    # -------------------------------------------------------------------------
    # Task 1 — Enable the AAP OIDC / JWT issuer
    # NOTE: Verify the exact endpoint and setting key against your AAP 2.7 instance.
    # The Gateway settings endpoint below is the expected path for AAP 2.7 deployments
    # that include the platform gateway component. On standalone controller-only deployments
    # the endpoint may instead be /api/v2/settings/system/.
    # -------------------------------------------------------------------------
    - name: Enable AAP OIDC issuer via Gateway settings API
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/gateway/v1/settings/"
        method: PATCH
        url_username: "{{ tower_username }}"
        url_password: "{{ tower_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          ANSIBLE_CONTROLLER_GATEWAY_ENABLED: true
        status_code:
          - 200
          - 204
        validate_certs: "{{ tower_verify_ssl }}"
      register: oidc_enable_result
      no_log: true

    - name: Report OIDC issuer enablement result
      ansible.builtin.debug:
        msg: "OIDC issuer setting applied (HTTP {{ oidc_enable_result.status }})"

    # -------------------------------------------------------------------------
    # Task 2 — Create the custom credential type for HashiCorp Vault JWT auth
    # -------------------------------------------------------------------------
    - name: Create HashiCorp Vault JWT credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ tower_username }}"
        url_password: "{{ tower_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "HashiCorp Vault JWT"
          kind: "cloud"
          inputs:
            fields:
              - id: "vault_addr"
                type: "string"
                label: "Vault Address"
              - id: "vault_jwt_mount"
                type: "string"
                label: "JWT Auth Mount Path"
              - id: "vault_role"
                type: "string"
                label: "JWT Role Name"
            required:
              - "vault_addr"
              - "vault_jwt_mount"
              - "vault_role"
          injectors:
            extra_vars:
              vault_addr: "{% raw %}{{ vault_addr }}{% endraw %}"
              vault_jwt_mount: "{% raw %}{{ vault_jwt_mount }}{% endraw %}"
              vault_role: "{% raw %}{{ vault_role }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ tower_verify_ssl }}"
      register: credential_type_result
      no_log: true
      failed_when:
        - credential_type_result.status == 400
        - "'name already exists' not in (credential_type_result.json | to_json)"

    - name: Capture credential type ID
      ansible.builtin.set_fact:
        vault_jwt_credential_type_id: "{{ credential_type_result.json.id }}"

    - name: Report credential type creation
      ansible.builtin.debug:
        msg: "Created credential type 'HashiCorp Vault JWT' with ID {{ vault_jwt_credential_type_id }}"

    # -------------------------------------------------------------------------
    # Task 3 — Create the Vault Bootstrap Token credential type
    # -------------------------------------------------------------------------
    - name: Create Vault Bootstrap Token credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ tower_username }}"
        url_password: "{{ tower_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Vault Bootstrap Token"
          kind: "cloud"
          inputs:
            fields:
              - id: "vault_token"
                type: "string"
                label: "Vault Bootstrap Token"
                secret: true
            required:
              - "vault_token"
          injectors:
            extra_vars:
              vault_token: "{% raw %}{{ vault_token }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ tower_verify_ssl }}"
      register: vault_bootstrap_token_type_result
      no_log: true
      failed_when:
        - vault_bootstrap_token_type_result.status == 400
        - "'name already exists' not in (vault_bootstrap_token_type_result.json | to_json)"

    - name: Report Vault Bootstrap Token credential type creation
      ansible.builtin.debug:
        msg: "Created credential type 'Vault Bootstrap Token' (HTTP {{ vault_bootstrap_token_type_result.status }})"

    # -------------------------------------------------------------------------
    # Task 4 — Create the HCP Vault Bootstrap Token credential type
    # -------------------------------------------------------------------------
    - name: Create HCP Vault Bootstrap Token credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ tower_username }}"
        url_password: "{{ tower_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "HCP Vault Bootstrap Token"
          kind: "cloud"
          inputs:
            fields:
              - id: "vault_token"
                type: "string"
                label: "HCP Service Principal Token"
                secret: true
            required:
              - "vault_token"
          injectors:
            extra_vars:
              vault_token: "{% raw %}{{ vault_token }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ tower_verify_ssl }}"
      register: hcp_vault_bootstrap_token_type_result
      no_log: true
      failed_when:
        - hcp_vault_bootstrap_token_type_result.status == 400
        - "'name already exists' not in (hcp_vault_bootstrap_token_type_result.json | to_json)"

    - name: Report HCP Vault Bootstrap Token credential type creation
      ansible.builtin.debug:
        msg: "Created credential type 'HCP Vault Bootstrap Token' (HTTP {{ hcp_vault_bootstrap_token_type_result.status }})"

    # -------------------------------------------------------------------------
    # Task 5 — Create the AAP Admin Credential type
    # -------------------------------------------------------------------------
    - name: Create AAP Admin Credential type
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ tower_username }}"
        url_password: "{{ tower_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "AAP Admin Credential"
          kind: "cloud"
          inputs:
            fields:
              - id: "aap_username"
                type: "string"
                label: "AAP Admin Username"
              - id: "aap_password"
                type: "string"
                label: "AAP Admin Password"
                secret: true
            required:
              - "aap_username"
              - "aap_password"
          injectors:
            extra_vars:
              aap_username: "{% raw %}{{ aap_username }}{% endraw %}"
              aap_password: "{% raw %}{{ aap_password }}{% endraw %}"
        status_code:
          - 200
          - 201
          - 400
        validate_certs: "{{ tower_verify_ssl }}"
      register: aap_admin_credential_type_result
      no_log: true
      failed_when:
        - aap_admin_credential_type_result.status == 400
        - "'name already exists' not in (aap_admin_credential_type_result.json | to_json)"

    - name: Report AAP Admin Credential type creation
      ansible.builtin.debug:
        msg: "Created credential type 'AAP Admin Credential' (HTTP {{ aap_admin_credential_type_result.status }})"

    # -------------------------------------------------------------------------
    # Task 6 — Create a credential instance of the HashiCorp Vault JWT type
    # -------------------------------------------------------------------------
    - name: Create Vault JWT credential instance
      ansible.builtin.uri:
        url: "{{ aap_api_base }}/api/v2/credentials/"
        method: POST
        url_username: "{{ tower_username }}"
        url_password: "{{ tower_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          name: "Vault JWT - {{ vault_jwt_role_name }}"
          credential_type: "{{ vault_jwt_credential_type_id }}"
          inputs:
            vault_addr: "{{ vault_addr }}"
            vault_jwt_mount: "{{ vault_jwt_mount_path }}"
            vault_role: "{{ vault_jwt_role_name }}"
        status_code:
          - 200
          - 201
        validate_certs: "{{ tower_verify_ssl }}"
      register: credential_result
      no_log: true

    - name: Report credential instance creation
      ansible.builtin.debug:
        msg: "Created credential '{{ credential_result.json.name }}' with ID {{ credential_result.json.id }}"
