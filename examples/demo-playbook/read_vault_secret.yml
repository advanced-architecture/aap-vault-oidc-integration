---
# ---------------------------------------------------------------------------
# IMPORTANT: This playbook MUST be run as an AAP Job Template.
#
# AAP 2.7 injects a short-lived per-job OIDC JWT token into the execution
# environment via the environment variable AAP_JWT_TOKEN. This token is used
# to authenticate directly to Vault without any static credentials.
#
# Running this playbook locally (e.g. via `ansible-playbook`) will fail at the
# JWT-capture step because AAP_JWT_TOKEN will not be set.
#
# NOTE: AAP_JWT_TOKEN is the expected environment variable name as of AAP 2.7.
# Confirm the exact variable name during live testing against your AAP instance,
# as it may differ depending on configuration or future releases.
# ---------------------------------------------------------------------------

- name: Demo — Read Vault secret using AAP OIDC JWT (no static credentials)
  hosts: localhost
  gather_facts: false

  collections:
    - community.hashi_vault

  vars_files:
    - vars.yml

  tasks:
    - name: Capture AAP-injected JWT token from environment
      ansible.builtin.set_fact:
        jwt_token: "{{ lookup('env', 'AAP_JWT_TOKEN') }}"

    - name: Fail if AAP_JWT_TOKEN is not set
      ansible.builtin.fail:
        msg: >-
          AAP_JWT_TOKEN environment variable is not set.
          Ensure the OIDC issuer is enabled in AAP 2.7 and this playbook
          is run as an AAP job template.
      when: jwt_token | length == 0

    - name: Authenticate to Vault using the AAP JWT token
      community.hashi_vault.vault_login:
        url: "{{ vault_addr }}"
        auth_method: jwt
        mount_point: "{{ vault_jwt_mount_path }}"
        role_id: "{{ vault_jwt_role_name }}"
        jwt: "{{ jwt_token }}"
      register: vault_login_result
      no_log: true

    - name: Read secret from Vault
      community.hashi_vault.vault_read:
        url: "{{ vault_addr }}"
        path: "{{ vault_secret_path }}"
        auth_method: token
        token: "{{ vault_login_result.login.auth.client_token }}"
      register: vault_secret
      no_log: true

    - name: Confirm secret retrieval (keys only — values are not printed)
      ansible.builtin.debug:
        msg: >-
          Secret retrieved successfully from {{ vault_secret_path }}.
          Keys found: {{ vault_secret.data.data.keys() | list }}
